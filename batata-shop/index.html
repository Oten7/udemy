<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batata Prime | Loja de Batatas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <nav class="nav container">
      <h1 class="logo">🥔 Batata Prime</h1>
      <button id="open-cart" class="cart-button" aria-label="Abrir carrinho">
        Carrinho <span id="cart-count" class="badge">0</span>
      </button>
    </nav>

    <div class="hero-content container">
      <p class="tag">Entrega rápida • Ingredientes frescos</p>
      <h2>Sabor de verdade em cada batata.</h2>
      <p>Monte seu pedido em segundos e receba sua batata favorita ainda quentinha.</p>
      <a href="#produtos" class="cta">Ver cardápio</a>
    </div>
  </header>

  <main>
    <section id="produtos" class="container products-section">
      <div class="section-title">
        <h3>Nosso Cardápio</h3>
        <p>Produtos carregados direto do banco de dados.</p>
      </div>
      <div id="product-grid" class="product-grid"></div>
    </section>
  </main>

  <aside id="cart" class="cart" aria-hidden="true">
    <div class="cart-header">
      <h3>Seu pedido</h3>
      <button id="close-cart" class="icon-button" aria-label="Fechar carrinho">✕</button>
    </div>

    <div id="cart-items" class="cart-items"></div>

    <div class="cart-footer">
      <div class="form-grid">
        <input id="customer-name" type="text" placeholder="Seu nome" />
        <input id="customer-phone" type="tel" placeholder="Seu WhatsApp" />
      </div>
      <p class="total">Total: <strong id="cart-total">R$ 0,00</strong></p>
      <button id="checkout" class="checkout">Finalizar pedido</button>
      <p id="order-feedback" class="feedback"></p>
    </div>
  </aside>

  <div id="overlay" class="overlay" hidden></div>

  <script src="script.js"></script>
</body>
</html>
